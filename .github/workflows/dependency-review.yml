name: Dependency review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          # Block PRs introducing dependencies with known high-severity CVEs.
          # Moderate stays as warning so transient advisories don't halt unrelated work.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Allow the licenses we already depend on repo-wide. Expand as new deps appear.
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC-BY-4.0,
            CC0-1.0, 0BSD, Unlicense, Python-2.0
