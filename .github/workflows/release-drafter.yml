name: Release drafter

on:
  # One trigger path — PR events keep the draft current as PRs merge / update.
  # No separate push trigger: changesets drives the actual releases; this just
  # maintains a human-readable draft on GitHub.
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, closed]

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: true

jobs:
  update_release_draft:
    name: Update release draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
