name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Pre-flight gate — re-runs the heavy validate (publint + attw + consumer install)
  # on the exact SHA that's about to publish. This closes the gap where workflow_dispatch
  # can trigger a publish without going through CI.
  validate:
    name: Pre-flight validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: ./.github/actions/setup
        with:
          fetch-depth: '0'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r --if-present test
      - run: pnpm tk validate all

  release:
    name: Version or publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write # SLSA provenance for npm publish
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Release PR / tag pushes need the GitHub-provided token to persist.
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Enables SLSA provenance attestation on npm — requires `id-token: write`.
          NPM_CONFIG_PROVENANCE: 'true'
