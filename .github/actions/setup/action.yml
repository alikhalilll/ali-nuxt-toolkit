name: Setup toolchain
description: pnpm + Node + frozen install — the shared toolchain preamble. Caller must run `actions/checkout` first (repo-relative composite actions can't check themselves out).

inputs:
  node-version:
    description: Node.js version to install. Defaults to the repo's engines.node floor (20).
    required: false
    default: '20'
  install:
    description: Run `pnpm install --frozen-lockfile`. Set 'false' to skip (rare — only when a job needs no deps).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.32.1
        run_install: false

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
